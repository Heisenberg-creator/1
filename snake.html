<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .container { text-align: center; }
  h1 { color: #e94560; margin-bottom: 10px; font-size: 2rem; }
  .score { color: #fff; font-size: 1.2rem; margin-bottom: 8px; }
  .score span { color: #0f3460; background: #e94560; padding: 2px 10px; border-radius: 4px; }
  canvas { border: 2px solid #e94560; background: #16213e; display: block; margin: 0 auto; }
  .tip { color: #888; margin-top: 10px; font-size: 0.85rem; }
  button {
    margin-top: 10px;
    padding: 8px 30px;
    font-size: 1rem;
    border: none;
    border-radius: 4px;
    background: #e94560;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #c73e54; }
</style>
</head>
<body>
<div class="container">
  <h1>贪吃蛇</h1>
  <div class="score">得分: <span id="score">0</span></div>
  <canvas id="canvas"></canvas>
  <p class="tip">方向键 / WASD 控制方向 | 空格暂停</p>
  <button id="restart">重新开始</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const SIZE = 20;
const COLS = 20;
const ROWS = 20;
canvas.width = COLS * SIZE;
canvas.height = ROWS * SIZE;

let snake, food, dx, dy, score, gameLoop, running, paused, nextDir;

function init() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 },
  ];
  food = spawnFood();
  dx = 1; dy = 0;
  nextDir = { dx: 1, dy: 0 };
  score = 0;
  running = true;
  paused = false;
  scoreEl.textContent = '0';
}

function spawnFood() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS),
    };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 食物
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // 蛇
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#0f3460' : '#533483';
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

function step() {
  if (!running || paused) return;

  dx = nextDir.dx;
  dy = nextDir.dy;

  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver();
    return;
  }

  // 撞自己
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    food = spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function gameOver() {
  running = false;
  clearInterval(gameLoop);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 28px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2);
  ctx.font = '16px "Segoe UI", Arial';
  ctx.fillText(`最终得分: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
}

document.addEventListener('keydown', e => {
  if (!running) return;

  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': if (dy !== 1) { nextDir = { dx: 0, dy: -1 }; } e.preventDefault(); break;
    case 'ArrowDown':  case 's': case 'S': if (dy !== -1) { nextDir = { dx: 0, dy: 1 }; } e.preventDefault(); break;
    case 'ArrowLeft':  case 'a': case 'A': if (dx !== 1) { nextDir = { dx: -1, dy: 0 }; } e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': if (dx !== -1) { nextDir = { dx: 1, dy: 0 }; } e.preventDefault(); break;
    case ' ':
      if (running) {
        paused = !paused;
        if (!paused) draw();
        else {
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 24px "Segoe UI", Arial';
          ctx.textAlign = 'center';
          ctx.fillText('暂停中', canvas.width / 2, canvas.height / 2);
        }
      }
      e.preventDefault();
      break;
  }
});

document.getElementById('restart').addEventListener('click', () => {
  clearInterval(gameLoop);
  init();
  draw();
  gameLoop = setInterval(step, 120);
});

init();
draw();
gameLoop = setInterval(step, 120);
</script>
</body>
</html>
