<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考公高频词学习卡片</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: linear-gradient(135deg, #f5f0eb 0%, #e8e0d5 30%, #f0ebe3 60%, #faf7f2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 600px;
}

/* 进度条 */
.progress-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
}
.progress-text {
  font-size: 15px;
  color: #8b7e6a;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.progress-bar-outer {
  flex: 1;
  max-width: 200px;
  height: 6px;
  background: #e0d8cc;
  border-radius: 10px;
  overflow: hidden;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, #c9a87c, #b8936e);
  border-radius: 10px;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 主卡片 */
.card {
  background: #fffdf9;
  border-radius: 28px;
  padding: 48px 40px 40px;
  box-shadow: 0 2px 24px rgba(0,0,0,0.06), 0 8px 40px rgba(0,0,0,0.04);
  text-align: center;
  position: relative;
  transition: transform 0.2s;
}

/* 类型标签 */
.type-badge {
  display: inline-block;
  font-size: 12px;
  color: #b8936e;
  background: #f5ede0;
  padding: 4px 14px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  margin-bottom: 24px;
  font-weight: 500;
}

/* 词条大字 */
.word-display {
  font-size: clamp(36px, 8vw, 56px);
  font-weight: 800;
  color: #3e3222;
  letter-spacing: 2px;
  line-height: 1.2;
  margin-bottom: 20px;
  word-break: keep-all;
}

/* 拼音（可选） */
.pinyin {
  font-size: 15px;
  color: #b0a394;
  font-weight: 400;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

/* 含义区域 */
.meaning-area {
  background: linear-gradient(135deg, #faf6ef, #f5ede0);
  border-radius: 18px;
  padding: 24px 28px;
  margin-bottom: 36px;
  border: 1px solid #ede3d3;
}
.meaning-label {
  font-size: 12px;
  color: #b8936e;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
  font-weight: 600;
}
.meaning-text {
  font-size: 17px;
  color: #5c4f3c;
  line-height: 1.7;
  font-weight: 400;
}

/* 按钮区域 */
.btn-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.nav-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: #fff;
  box-shadow: 0 1px 8px rgba(0,0,0,0.08);
  cursor: pointer;
  font-size: 22px;
  color: #6b5d4b;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.nav-btn:hover {
  background: #f5ede0;
  transform: scale(1.06);
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.nav-btn:active {
  transform: scale(0.94);
  transition: transform 0.1s;
}
.nav-btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.page-indicator {
  font-size: 15px;
  color: #8b7e6a;
  font-weight: 500;
  min-width: 80px;
  text-align: center;
  letter-spacing: 0.5px;
}

/* 底部提示 */
.hint {
  text-align: center;
  font-size: 13px;
  color: #bfb5a4;
  margin-top: 24px;
  letter-spacing: 0.4px;
}

/* 响应式 */
@media (max-width: 480px) {
  .card {
    padding: 32px 22px 28px;
    border-radius: 22px;
  }
  .word-display {
    font-size: clamp(30px, 10vw, 44px);
  }
  .meaning-area {
    padding: 18px 18px;
  }
  .meaning-text {
    font-size: 15px;
  }
  .nav-btn {
    width: 44px;
    height: 44px;
  }
}
</style>
</head>
<body>

<div class="container">
  <!-- 顶部进度 -->
  <div class="progress-wrap">
    <span class="progress-text" id="progressLabel">进度</span>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar"></div>
    </div>
  </div>

  <!-- 主卡片 -->
  <div class="card">
    <div class="type-badge" id="typeBadge">四字成语</div>
    <div class="word-display" id="wordDisplay"></div>
    <div class="pinyin" id="pinyinDisplay"></div>
    <div class="meaning-area">
      <div class="meaning-label">释义</div>
      <div class="meaning-text" id="meaningDisplay"></div>
    </div>
    <div class="btn-row">
      <button class="nav-btn" id="prevBtn" title="上一个">
        <svg viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20"/></svg>
      </button>
      <span class="page-indicator" id="pageIndicator"></span>
      <button class="nav-btn" id="nextBtn" title="下一个">
        <svg viewBox="0 0 24 24"><polyline points="9,4 17,12 9,20"/></svg>
      </button>
    </div>
  </div>

  <div class="hint">点击按钮或使用 ← → 方向键切换词条</div>
</div>

<script>
// ========== 完整词库 ==========
const vocabulary = [
  // ===== 一、高频必考成语（23条）=====
  { word: "层出不穷", meaning: "接连不断地出现，没有穷尽。申论中常用于描述新事物、新问题不断涌现的态势。" },
  { word: "大相径庭", meaning: "彼此相差很远或矛盾很大。常用于对比两种观点、做法或局面的巨大差异。" },

  { word: "理所当然", meaning: "按道理应当这样。强调符合情理或规律，没有疑问。" },
  { word: "相辅相成", meaning: "两件事物互相配合、互相补充，共同发挥作用。申论常用以论述多元举措协同推进。" },

  { word: "根深蒂固", meaning: "比喻基础深厚牢固，不容易动摇。常用于形容长期形成的观念、习惯或问题。" },
  { word: "潜移默化", meaning: "指人的思想、性格在不知不觉中受到感染、影响而发生变化。" },

  { word: "故步自封", meaning: "比喻安于现状，不求进取。申论中多用于批评保守落后的思想或做法。" },
  { word: "人云亦云", meaning: "别人怎么说自己也跟着怎么说。形容没有主见，随声附和。" },
  { word: "舍本逐末", meaning: "放弃根本而追求枝节。比喻做事不抓主要矛盾，轻重倒置。" },
  { word: "司空见惯", meaning: "看惯了就不觉得奇怪。形容某事常见，不足为奇。" },
  { word: "推陈出新", meaning: "去掉旧事物的糟粕，取其精华，使其向新的方向发展。常用于创新领域。" },

  { word: "凤毛麟角", meaning: "比喻珍贵而稀少的人或事物。形容极为难得。" },
  { word: "急功近利", meaning: "急于求成，贪图眼前利益。申论中多用于批评短视行为和发展方式。" },
  { word: "南辕北辙", meaning: "行动与目的正好相反。比喻方向不对，越努力离目标越远。" },

  { word: "一脉相承", meaning: "由一个血统或一个派别传下来。比喻某种思想、学说或传统之间的继承关系。" },

  // ===== 二、公考易错及易混淆成语（30条）=====
  { word: "不刊之论", meaning: "比喻不能改动或不可磨灭的言论。非指不能刊登的言论。" },
  { word: "差强人意", meaning: "大体上还能让人满意。易被误用为"使人不满意"，实际是勉强满意的意思。" },

  { word: "鞭辟入里", meaning: "形容分析透彻，切中要害。多用于评论文章或言论的深刻性。" },

  { word: "不落窠臼", meaning: "比喻有独创风格，不落旧套。多用于文艺创作或工作创新。" },
  { word: "不期而遇", meaning: "没有约定而意外地相遇。" },
  { word: "不胫而走", meaning: "没有腿却能跑。比喻事物不待推行就迅速地传播开去。" },
  { word: "不可理喻", meaning: "不能用道理使他明白。形容态度蛮横、不讲道理。" },
  { word: "不足为训", meaning: "不值得作为效法的准则或榜样。" },
  { word: "不负使命", meaning: "不辜负所肩负的责任与任务。" },

  // ===== 三、施政方略类成语（20条）=====

  { word: "刻不容缓", meaning: "片刻也不能拖延。形容形势紧迫，必须立即行动。" },

  { word: "曲突徙薪", meaning: "把烟囱改弯，把柴草移开。比喻事先采取措施，防患于未然。" },

  { word: "杀鸡取卵", meaning: "为了得到鸡蛋而把鸡杀了。比喻贪图眼前小利而损害长远利益。" },
  { word: "竭泽而渔", meaning: "排干湖水捕鱼。比喻只顾眼前利益，不作长远打算。" },

  { word: "扬汤止沸", meaning: "把开水舀起来再倒回去，想制止沸腾。比喻办法不彻底，不能从根本上解决问题。" },
  { word: "釜底抽薪", meaning: "从锅底下抽取柴火。比喻从根本上解决问题。" },

  { word: "功成不居", meaning: "立了功而不把功劳归于自己。形容谦虚低调。" },

  { word: "过犹不及", meaning: "事情做得过头，就跟做得不够一样，都是不合适的。强调适度原则。" },

  { word: "集思广益", meaning: "集中众人的智慧，广泛吸收有益的意见。" },

  { word: "习以为常", meaning: "习惯了就觉得平常了。" },
  { word: "细入毫芒", meaning: "形容精微细致到了极点。" },
  { word: "心无旁骛", meaning: "心思没有另外的追求。形容专心致志、精神高度集中。" },

  { word: "一衣带水", meaning: "像一条衣带那样狭窄的水域。形容两地仅一水之隔，非常邻近。" },

  { word: "重整旗鼓", meaning: "重新整顿战旗战鼓。比喻失败之后重新积聚力量再干。" },

  { word: "盲区", meaning: "看不见或顾及不到的区域。常用语：监管盲区、治理盲区。" },
  { word: "红线", meaning: "不可逾越的界线。常用语：生态红线、耕地红线。" },
  { word: "底线", meaning: "最低的限度或条件。常用语：守住底线、底线思维。" },
  { word: "高压线", meaning: "高压输电线，比喻绝对不能触犯的禁令。常用语：纪律高压线。" },
  { word: "警戒线", meaning: "警戒时设置的安全界线。比喻不可逾越的标准。" },
  { word: "防火墙", meaning: "防止火灾蔓延的墙，比喻安全防护措施。常用语：安全防火墙。" },
  { word: "安全阀", meaning: "保障安全的阀门，比喻防范风险的机制。常用语：社会安全阀。" },

  { word: "主动仗", meaning: "掌握主动权的仗。比喻主动出击、掌握主动权。常用语：打好主动仗。" },
];

// ========== 导航逻辑 ==========
let currentIndex = 0;
const totalCount = vocabulary.length;

const wordDisplay = document.getElementById('wordDisplay');
const meaningDisplay = document.getElementById('meaningDisplay');
const pageIndicator = document.getElementById('pageIndicator');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');
const typeBadge = document.getElementById('typeBadge');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pinyinDisplay = document.getElementById('pinyinDisplay');

function isFourChar(word) {
  return word.length === 4 && /^[一-鿿]{4}$/.test(word);
}

function renderCard() {
  const item = vocabulary[currentIndex];
  wordDisplay.textContent = item.word;
  meaningDisplay.textContent = item.meaning;
  pageIndicator.textContent = `第 ${currentIndex + 1} / ${totalCount} 个`;
  progressLabel.textContent = `进度 ${Math.round((currentIndex + 1) / totalCount * 100)}%`;
  progressBar.style.width = ((currentIndex + 1) / totalCount * 100) + '%';

  if (isFourChar(item.word)) {
    typeBadge.textContent = '四字成语';
    pinyinDisplay.style.display = 'none';
  } else {
    typeBadge.textContent = '二字词语';
    pinyinDisplay.style.display = 'none';
  }
}

function goNext() {
  currentIndex = (currentIndex + 1) % totalCount;
  renderCard();
}

function goPrev() {
  currentIndex = (currentIndex - 1 + totalCount) % totalCount;
  renderCard();
}

prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);

// 键盘导航
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goPrev();
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    goNext();
  }
});

// 触摸滑动支持
let touchStartX = 0;
document.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', function(e) {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 60) {
    if (diff > 0) {
      goPrev();
    } else {
      goNext();
    }
  }
});

// 初始渲染
renderCard();
</script>
