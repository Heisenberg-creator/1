<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考公高频词学习卡片</title>
<style>
  :root {
    --bg: #f5f2eb;
    --card-bg: #ffffff;
    --card-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    --text-primary: #2c2c2c;
    --text-secondary: #5a5a5a;
    --meaning-bg: #f9f7f2;
    --meaning-border: #e8e3d5;
    --accent: #3b6fb6;
    --accent-hover: #345d9e;
    --btn-bg: #ffffff;
    --btn-border: #d5d0c5;
    --btn-hover-bg: #f0ede5;
    --btn-active-bg: #e8e5dc;
    --progress-text: #8c8c8c;
    --divider: #e5e0d5;
    --tag-bg: #edf2f8;
    --tag-text: #3b6fb6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .app-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---- Progress Bar ---- */
  .progress-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .progress-text {
    font-size: 0.9rem;
    color: var(--progress-text);
    letter-spacing: 0.02em;
  }
  .progress-bar-outer {
    flex: 1;
    height: 4px;
    background: #e0dcd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ---- Card ---- */
  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 36px 32px 28px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card.swiping-left { transform: translateX(-12px); opacity: 0.85; }
  .card.swiping-right { transform: translateX(12px); opacity: 0.85; }

  .word-type-tag {
    display: inline-block;
    font-size: 0.75rem;
    padding: 4px 12px;
    border-radius: 12px;
    background: var(--tag-bg);
    color: var(--tag-text);
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }

  .word-display {
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.04em;
    line-height: 1.3;
    text-align: center;
    word-break: keep-all;
  }

  .divider-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--divider);
    margin: 10px 0 8px;
  }

  .meaning-display {
    font-size: 1.05rem;
    color: var(--text-secondary);
    line-height: 1.7;
    text-align: center;
    background: var(--meaning-bg);
    border: 1px solid var(--meaning-border);
    border-radius: 16px;
    padding: 16px 20px;
    width: 100%;
  }

  /* ---- Buttons ---- */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .nav-btn {
    flex: 1;
    max-width: 160px;
    padding: 14px 0;
    border-radius: 50px;
    border: 1.5px solid var(--btn-border);
    background: var(--btn-bg);
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.2s, border-color 0.2s, transform 0.12s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    -webkit-user-select: none;
  }
  .nav-btn:hover {
    background: var(--btn-hover-bg);
    border-color: #c5bfb0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .nav-btn:active {
    background: var(--btn-active-bg);
    transform: scale(0.97);
  }
  .nav-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .nav-btn .arrow { font-size: 1.15rem; line-height: 1; }

  /* ---- Keyboard hint ---- */
  .kb-hint {
    text-align: center;
    font-size: 0.78rem;
    color: #b0aca2;
    letter-spacing: 0.02em;
  }
  .kb-hint kbd {
    display: inline-block;
    background: #ece8de;
    border: 1px solid #d5d0c5;
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 0.75rem;
    font-family: inherit;
    line-height: 1.5;
  }

  /* ---- Shuffle button ---- */
  .util-row {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .util-btn {
    padding: 8px 20px;
    border-radius: 50px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    font-size: 0.85rem;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.12s;
  }
  .util-btn:hover { background: var(--btn-hover-bg); border-color: #c5bfb0; }
  .util-btn:active { transform: scale(0.97); }

  /* ---- Responsive ---- */
  @media (max-width: 480px) {
    body { padding: 12px; align-items: flex-start; padding-top: 30px; }
    .card { padding: 28px 20px 22px; border-radius: 20px; }
    .word-display { font-size: 2rem; }
    .meaning-display { font-size: 0.95rem; padding: 14px 16px; }
    .nav-btn { max-width: 130px; padding: 12px 0; font-size: 0.9rem; }
  }
  @media (min-width: 768px) {
    .card { padding: 44px 40px 32px; }
    .word-display { font-size: 3rem; }
  }
</style>
</head>
<body>

<div class="app-container">

  <!-- Progress -->
  <div class="progress-wrap">
    <span class="progress-text" id="progressLabel">第 1 / 420 个</span>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar" style="width: 0.24%;"></div>
    </div>
  </div>

  <!-- Card -->
  <div class="card" id="card">
    <div class="word-type-tag" id="typeTag">四字成语</div>
    <div class="word-display" id="wordDisplay">层出不穷</div>
    <div class="divider-dot"></div>
    <div class="meaning-display" id="meaningDisplay">接连不断地出现，没有穷尽。申论中常用于描述新事物、新业态、新问题的持续涌现。</div>
  </div>

  <!-- Navigation -->
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" title="上一个 (← 键)">
      <span class="arrow">‹</span> 上一个
    </button>
    <button class="nav-btn" id="nextBtn" title="下一个 (→ 键)">
      下一个 <span class="arrow">›</span>
    </button>
  </div>

  <!-- Utilities -->
  <div class="util-row">
    <button class="util-btn" id="randomBtn">🎲 随机跳转</button>
    <button class="util-btn" id="resetBtn">↺ 回到第一</button>
  </div>

  <!-- Keyboard hint -->
  <div class="kb-hint">
    按 <kbd>←</kbd> <kbd>→</kbd> 方向键快速切换
  </div>
</div>

<script>

  // ========== 高频必考成语 (23条) ==========
  { word: "层出不穷", meaning: "接连不断地出现，没有穷尽。申论中用于描述新事物、新业态、新问题的持续涌现。" },
  { word: "大相径庭", meaning: "比喻相差很远，大不相同。常用于对比两种观点、做法或现象的巨大差异。" },

  { word: "故步自封", meaning: "比喻守着老一套，不求进步。批评因循守旧、缺乏改革意识的保守心态。" },

  { word: "一劳永逸", meaning: "辛苦一次把事情办好，以后就不再费事了。常用于提醒制度建设要着眼长远。" },

  { word: "空穴来风", meaning: "有了洞穴才有风进来，比喻消息和传说不是完全没有根据的。常被误用为'毫无根据'。" },

// ==================== 状态管理 ====================
var currentIndex = 0;
var totalCount = wordBank.length;

// ==================== DOM引用 ====================
var cardEl = document.getElementById('card');
var wordDisplayEl = document.getElementById('wordDisplay');
var meaningDisplayEl = document.getElementById('meaningDisplay');
var typeTagEl = document.getElementById('typeTag');
var progressLabelEl = document.getElementById('progressLabel');
var progressBarEl = document.getElementById('progressBar');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var randomBtn = document.getElementById('randomBtn');
var resetBtn = document.getElementById('resetBtn');

// ==================== 辅助函数 ====================
function isFourChar(word) {
  // 四字成语 = 4个汉字，排除二字词语
  return word.length === 4;
}

function getWordType(word) {
  return isFourChar(word) ? '四字成语' : '二字词语';
}

// ==================== 渲染 ====================
function renderCard(index) {
  var item = wordBank[index];
  wordDisplayEl.textContent = item.word;
  meaningDisplayEl.textContent = item.meaning;
  typeTagEl.textContent = getWordType(item.word);
  progressLabelEl.textContent = '第 ' + (index + 1) + ' / ' + totalCount + ' 个';
  progressBarEl.style.width = ((index + 1) / totalCount * 100) + '%';
}

// ==================== 导航 ====================
function goToPrev() {
  currentIndex = currentIndex <= 0 ? totalCount - 1 : currentIndex - 1;
  renderCard(currentIndex);
}

function goToNext() {
  currentIndex = currentIndex >= totalCount - 1 ? 0 : currentIndex + 1;
  renderCard(currentIndex);
}

function goToRandom() {
  var newIndex;
  do {
    newIndex = Math.floor(Math.random() * totalCount);
  } while (newIndex === currentIndex && totalCount > 1);
  currentIndex = newIndex;
  renderCard(currentIndex);
}

function goToFirst() {
  currentIndex = 0;
  renderCard(currentIndex);
}

// ==================== 触摸/滑动手势 ====================
var touchStartX = 0;
var touchStartY = 0;

cardEl.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});

cardEl.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  // 水平滑动超过30px且大于垂直滑动
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) {
      goToPrev();
    } else {
      goToNext();
    }
  }
});

// ==================== 键盘支持 ====================
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goToPrev();
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    goToNext();
  }
});

// ==================== 按钮事件 ====================
prevBtn.addEventListener('click', goToPrev);
nextBtn.addEventListener('click', goToNext);
randomBtn.addEventListener('click', goToRandom);
resetBtn.addEventListener('click', goToFirst);

// ==================== 初始渲染 ====================
renderCard(0);

})();
</script>
</body>
</html>
